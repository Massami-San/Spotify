<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>primeiro-projeto-Spotify</title>
    <link rel="stylesheet" href="../CSS/Style.css">
    <script src="https://kit.fontawesome.com/ffb68bb61b.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="logo">
            <i class="fa-brands fa-spotify"></i>
        </div>
        <button class="but-Home" aria-label="Página inicial"><i class="fa-solid fa-house"></i></button>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="main-input" placeholder="O que você quer ouvir?">
        </div>
        <nav class="main-nav">
            <a>Premium</a>
            <a>Suporte</a>
            <a>Baixar</a>
        </nav>
        <div class="account-actions">
            <a>Inscrever-se</a>
            <button class="login-button">Entrar</button>
        </div>
    </header>

    <main>
        <section class="left">
            <div class="sbb">
                <h2>Sua Biblioteca</h2>
                <button class="create"><i class="fa-solid fa-plus"></i>Criar</button>
            </div>
            <section class="Playlist">
                <h2>Crie sua primeira playlist</h2>
                <p>É fácil, vamos te ajudar.</p>
                <button>Criar Playlist</button>
            </section>

            <section class="Podcast">
                <h2>Que tal seguir um podcast novo?</h2>
                <p>Avisaremos você sobre novos episódios.</p>
                <button>Explorar Podcasts</button>
            </section>
            <a>Legal</a>
            <a>Segurança e Centro de Privacidade</a>
            <a>Política de Privacidade</a>
            <a>Cookies</a>
            <a>Sobre Anúncios</a>
            <a>Acessibilidade</a>
        </section>

        <section class="rigth">
            <h3>Músicas em alta</h3>
        </section>
    </main>
</body>
<script src="../js/Script.js"></script>
</html>
