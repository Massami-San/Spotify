<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>primeiro-projeto-Spotify</title>
    <link rel="stylesheet" href="../CSS/Style.css">
    <script src="https://kit.fontawesome.com/ffb68bb61b.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="logo">
            <i class="fa-brands fa-spotify"></i>
        </div>
        <button class="but-Home"><i class="fa-regular fa-house"></i></button>
        <input type="text" placeholder="O que você quer ouvir?">
        <div>
            <a>Premium</a>
            <a>Suporte</a>
            <a>Baixar</a>
        </div>
        <div>
            <a>Inscrever-se</a>
            <button>Entrar</button>
        </div>
    </header>

    <main>
    <section class="left">
        <h2>Sua Biblioteca</h2>
        <button><i class="fa-solid fa-plus"></i>Criar</button>
        <section class="Playlist">
            <h2>Crie sua primeira playlist</h2>
            <p>É fácil, vamos te ajudar.</p>
            <button>Criar Playlist</button>
        </section>

        <section class="Podcast">
            <h2>Que tal seguir um podcast novo?</h2>
            <p>Avisaremos você sobre novos episódios.</p>
            <button>Explorar Podcasts</button>
        </section>
        <a>Legal</a>
        <a>Segurança e Centro de Privacidade</a>
        <a>Política de Privacidade</a>
        <a>Cookies</a>
        <a>Sobre Anúncios</a>
        <a>Acessibilidade</a>
    </section>

    <section class="rigth">
        <h3>Músicas em alta</h3>
        </section>
    </main>
</body>

</html>
